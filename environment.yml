# The conda environment used for every run in the paper (Windows 11, NVIDIA GeForce RTX 3060 12 GB).
# torch and torchvision are the CUDA 13.0 builds from the PyTorch wheel index; the NVIDIA driver must support CUDA 13.0.
#
#   conda env create -f environment.yml
#   conda activate effvar
#   pip install -e . --no-deps
name: effvar
channels:
  - conda-forge
dependencies:
  - python=3.11.16
  - pip=26.2.1
  - setuptools=84.0.0
  - wheel=0.48.0
  - packaging=26.3
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu130
      - torch==2.14.0+cu130
      - torchvision==0.29.0+cu130
      - transformers==5.17.0
      - accelerate==1.15.0
      - huggingface_hub==1.32.0
      - hf-xet==1.6.0
      - tokenizers==0.23.2
      - safetensors==0.8.0
      - medmnist==3.0.2
      - numpy==2.4.6
      - scipy==1.17.1
